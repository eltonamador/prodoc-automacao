name: Monitorar Prodoc - Mensagens Não Lidas

on:
  schedule:
    # Segunda a sexta: a cada 1 hora (9h às 18h UTC = 5h às 14h Brasília)
    - cron: '0 9-18 * * 1-5'
    # Sábado e domingo: a cada 12 horas (9h e 21h UTC)
    - cron: '0 9,21 * * 0,6'

  # Permitir execução manual
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4.1.7

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar monitoramento Prodoc
        env:
          PRODOC_USER: ${{ secrets.PRODOC_USER }}
          PRODOC_PASSWORD: ${{ secrets.PRODOC_PASSWORD }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python prodoc_monitor.py

      - name: Verificar se arquivo foi gerado
        if: always()
        run: |
          if [ -f resultado_prodoc.json ]; then
            echo "✅ Arquivo gerado com sucesso"
            cat resultado_prodoc.json
          else
            echo "⚠️ Arquivo não foi gerado (pode ser 0 documentos não lidos)"
          fi

      - name: Upload resultado (se existir)
        if: always() && hashFiles('resultado_prodoc.json') != ''
        uses: actions/upload-artifact@v4.3.1
        with:
          name: resultado-prodoc-${{ github.run_number }}
          path: resultado_prodoc.json
          retention-days: 30

      - name: Sumarizar execução
        if: always()
        run: |
          echo "📊 Execução concluída"
          echo "Timestamp: $(date)"
          echo "Verifique os logs acima para detalhes completos"
