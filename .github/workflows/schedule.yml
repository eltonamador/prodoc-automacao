name: Monitorar Prodoc - Mensagens Não Lidas

on:
  schedule:
    # Segunda a sexta: a cada 1 hora (9h às 18h UTC = 5h às 14h Brasília)
    - cron: '0 9-18 * * 1-5'
    # Sábado e domingo: a cada 12 horas (9h e 21h UTC)
    - cron: '0 9,21 * * 0,6'

  # Permitir execução manual
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Executar monitoramento Prodoc
        env:
          PRODOC_USER: ${{ secrets.PRODOC_USER }}
          PRODOC_PASSWORD: ${{ secrets.PRODOC_PASSWORD }}
          CLAUDE_API_KEY: ${{ secrets.CLAUDE_API_KEY }}
        run: python prodoc_monitor.py

      - name: Upload resultado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultado-prodoc-${{ github.run_number }}
          path: resultado_prodoc.json
          retention-days: 30

      - name: Notificar falha
        if: failure()
        run: |
          echo "❌ Execução do monitoramento falhou!"
          echo "Verifique os logs acima para detalhes."
          exit 1
