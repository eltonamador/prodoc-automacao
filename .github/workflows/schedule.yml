name: Monitorar Prodoc

on:
  schedule:
    # A cada hora de segunda a sexta, 9-18 UTC
    - cron: '0 9-18 * * 1-5'
    # A cada 12 horas no fim de semana (9 UTC e 21 UTC)
    - cron: '0 9,21 * * 0,6'
  workflow_dispatch:

jobs:
  monitor:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.1.7

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Prodoc Monitor
        run: python prodoc_monitor.py

      - name: Upload results
        if: always() && hashFiles('resultado_prodoc.json') != ''
        uses: actions/upload-artifact@v4.3.1
        with:
          name: prodoc-results
          path: resultado_prodoc.json
          retention-days: 30

      - name: Workflow Summary
        if: always()
        run: echo "✅ Monitoramento concluído"
