name: Testes

# O monitoramento agendado saiu daqui e passou a rodar na VPS (systemd timer).
# Motivos: (1) o agendamento aqui falhou em todas as execuções até 26/04/2026 e
# depois parou, sem causa recuperável — os logs expiraram; (2) o repositório é
# público, e o log do Actions exibiria assunto e remetente de documentos
# internos do CBMAP. Aqui ficam só os testes, que não tocam em dado real.

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Instalar dependências
        run: uv sync --locked
      - name: Lint
        run: uv run ruff check .
      - name: Rodar testes
        run: uv run pytest -v
